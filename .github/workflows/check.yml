name: check

# The framework's own tests. Instances get their own workflow from template/
# (it checks the user's config).
#   - every push and pull request: every check except the VM tests (vm-*):
#     evaluation, settings and network validation, the CLI, update
#     verification, the docs;
#   - on demand, everything, VM tests included:
#       gh workflow run check -R crossclo/nixod
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: checks without the VM tests
        run: |
          checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames \
            | jq -r '.[] | select(startswith("vm-") | not) | ".#checks.x86_64-linux.\(.)"')
          nix build --no-link -L --show-trace $checks

  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The VM tests (nixosTest) need KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: nix flake check
        run: nix flake check -L --show-trace
